<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathdle 六人互猜淘汰賽</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b111e;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 100vh;
        }

        /* 頂部標題區 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #cbd5e1;
        }

        /* 上方 8格方程式區塊（已放大） */
        .equation-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .equation-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 16px;
        }

        .player-label {
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* 放大後的 8 個空格 */
        .slots-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
        }

        .slot {
            aspect-ratio: 1;
            background-color: #1f2937;
            border: 2px solid #374151;
            border-radius: 6px;
            /* 增大格子的視覺感與尺寸限制 */
            min-height: 42px; 
            transition: all 0.2s;
        }

        /* 下方 玩家狀態卡片區塊（已縮小） */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .status-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 6px;
            padding: 8px 12px; /* 縮小內距 */
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        /* 模擬選中狀態（如原本的玩家2） */
        .status-card.active {
            border: 2px solid #2563eb;
            background-color: #0f172a;
        }

        .status-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem; /* 縮小字體 */
            font-weight: bold;
        }

        .badge-num {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #3b82f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .error-chance {
            background-color: #064e3b;
            color: #34d399;
            font-size: 0.7rem; /* 縮小字體 */
            padding: 1px 6px;
            border-radius: 12px;
            border: 1px solid #059669;
        }

        .status-bottom {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.75rem; /* 縮小狀態文字 */
            color: #9ca3af;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 4px;
        }

        /* 響應式微調 */
        @media (max-width: 1024px) {
            .equation-grid, .status-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 640px) {
            .equation-grid, .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Mathdle 猜題挑戰看板</div>
    </div>

    <!-- 上方：放大後的 8格方程式區塊 -->
    <div class="equation-grid">
        <!-- 玩家 1 -->
        <div class="equation-card">
            <div class="player-label">玩家 1</div>
            <div class="slots-container">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>
        <!-- 玩家 2 -->
        <div class="equation-card">
            <div class="player-label">玩家 2</div>
            <div class="slots-container">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>
        <!-- 玩家 3 -->
        <div class="equation-card">
            <div class="player-label">玩家 3</div>
            <div class="slots-container">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>
        <!-- 玩家 4 -->
        <div class="equation-card">
            <div class="player-label">玩家 4</div>
            <div class="slots-container">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>
        <!-- 玩家 5 -->
        <div class="equation-card">
            <div class="player-label">玩家 5</div>
            <div class="slots-container">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>
        <!-- 玩家 6 -->
        <div class="equation-card">
            <div class="player-label">玩家 6</div>
            <div class="slots-container">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>
    </div>

    <!-- 下方：縮小後的 玩家狀態卡片區塊 -->
    <div class="status-grid">
        <!-- 狀態 1 -->
        <div class="status-card">
            <div class="status-top">
                <div class="player-badge"><span class="badge-num" style="background-color: #3b82f6;">1</span> 玩家 1</div>
                <span class="error-chance">錯誤機會 3/3</span>
            </div>
            <div class="status-bottom">
                <div><span class="live-dot"></span>存活</div>
                <div>被挑戰 0 次</div>
            </div>
        </div>
        <!-- 狀態 2 (選中狀態) -->
        <div class="status-card active">
            <div class="status-top">
                <div class="player-badge"><span class="badge-num" style="background-color: #10b981;">2</span> 玩家 2</div>
                <span class="error-chance">錯誤機會 3/3</span>
            </div>
            <div class="status-bottom">
                <div><span class="live-dot"></span>存活</div>
                <div>被挑戰 0 次</div>
            </div>
        </div>
        <!-- 狀態 3 -->
        <div class="status-card">
            <div class="status-top">
                <div class="player-badge"><span class="badge-num" style="background-color: #f59e0b;">3</span> 玩家 3</div>
                <span class="error-chance">錯誤機會 3/3</span>
            </div>
            <div class="status-bottom">
                <div><span class="live-dot"></span>存活</div>
                <div>被挑戰 0 次</div>
            </div>
        </div>
        <!-- 狀態 4 -->
        <div class="status-card">
            <div class="status-top">
                <div class="player-badge"><span class="badge-num" style="background-color: #ec4899;">4</span> 玩家 4</div>
                <span class="error-chance">錯誤機會 3/3</span>
            </div>
            <div class="status-bottom">
                <div><span class="live-dot"></span>存活</div>
                <div>被挑戰 0 次</div>
            </div>
        </div>
        <!-- 狀態 5 -->
        <div class="status-card">
            <div class="status-top">
                <div class="player-badge"><span class="badge-num" style="background-color: #ef4444;">5</span> 玩家 5</div>
                <span class="error-chance">錯誤機會 3/3</span>
            </div>
            <div class="status-bottom">
                <div><span class="live-dot"></span>存活</div>
                <div>被挑戰 0 次</div>
            </div>
        </div>
        <!-- 狀態 6 -->
        <div class="status-card">
            <div class="status-top">
                <div class="player-badge"><span class="badge-num" style="background-color: #06b6d4;">6</span> 玩家 6</div>
                <span class="error-chance">錯誤機會 3/3</span>
            </div>
            <div class="status-bottom">
                <div><span class="live-dot"></span>存活</div>
                <div>被挑戰 0 次</div>
            </div>
        </div>
    </div>

</body>
</html>
